<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P7M ULTRA | v8.0 Enterprise</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --rb: linear-gradient(45deg, #ff0000, #00ff00, #0000ff, #ff0000); }
        body { background-color: #030406; color: #f1f5f9; font-family: 'Plus Jakarta Sans', sans-serif; }
        .premium-border { position: relative; padding: 1px; background: var(--rb); background-size: 300% 300%; animation: rb-move 4s linear infinite; border-radius: 16px; }
        @keyframes rb-move { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .glass-card { background: rgba(10, 11, 16, 0.98); backdrop-filter: blur(20px); border-radius: 15px; border: 1px solid rgba(255,255,255,0.03); }
        .input-glow { background: #08090d; border: 1px solid #1e293b; color: #fff; padding: 10px; border-radius: 8px; font-size: 11px; width: 100%; outline: none; }
        .input-glow:focus { border-color: #3b82f6; box-shadow: 0 0 15px rgba(59, 130, 246, 0.1); }
        .hidden { display: none; }
        .custom-scroll::-webkit-scrollbar { width: 3px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #3b82f6; }
    </style>
</head>
<body class="p-4">
    <div class="max-w-[1900px] mx-auto grid grid-cols-12 gap-6">
        <!-- Left: Proxy & Logic -->
        <div class="col-span-3 space-y-4">
            <div class="flex items-center gap-3 mb-2">
                <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center shadow-lg text-white font-black">P7</div>
                <h1 class="text-xl font-black tracking-tighter uppercase">P7M <span class="text-blue-500">ULTRA</span></h1>
            </div>

            <div class="premium-border">
                <div class="glass-card p-4 space-y-3">
                    <p class="text-[10px] font-black text-blue-400 uppercase tracking-widest text-center">Proxy Vault</p>
                    <select id="proxy-selector" class="input-glow" onchange="updateSelectedProxy()"><option value="">-- LOAD VAULT --</option></select>
                    <div class="flex items-center justify-between bg-black/40 p-3 rounded-lg border border-white/5">
                        <span class="text-[10px] text-zinc-400 uppercase font-bold">ASN Tunnel:</span>
                        <div id="proxy-status-light" class="w-3 h-3 rounded-full bg-red-600"></div>
                    </div>
                    <button onclick="connectServerProxy()" class="w-full bg-blue-600 py-3 rounded text-[10px] font-black uppercase hover:opacity-80">Test Connection</button>
                    <div id="ip-details" class="bg-black/50 p-3 rounded-lg text-[10px] font-mono min-h-[60px]">Ready, Boss.</div>
                </div>
            </div>

            <div class="glass-card p-5 border-b-4 border-blue-600">
                <div class="grid grid-cols-2 gap-3 mb-4 text-center">
                    <div class="bg-zinc-900 p-3 rounded-xl"><span class="text-[9px] text-zinc-500 uppercase">Inbox</span><p id="v-sent" class="text-3xl font-black text-green-500">0</p></div>
                    <div class="bg-zinc-900 p-3 rounded-xl"><span class="text-[9px] text-zinc-500 uppercase">Block</span><p id="v-fail" class="text-3xl font-black text-red-500">0</p></div>
                </div>
                <button onclick="launch()" id="btn-start" class="w-full bg-blue-600 py-4 rounded-xl font-black text-xs uppercase">Initiate Blast</button>
                <button onclick="forceStop()" id="btn-stop" class="w-full bg-red-900/20 text-red-500 border border-red-500/50 py-4 rounded-xl font-black text-xs hidden">Stop Engine</button>
            </div>
        </div>

        <!-- Center: Payload -->
        <div class="col-span-6 space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <div class="glass-card p-4 border border-white/5">
                    <span class="text-[10px] font-bold text-zinc-400 uppercase">SMTP Stack: <b id="count-smtp" class="text-blue-500">0</b></span>
                    <input type="file" id="f-smtp" accept=".csv" class="text-[10px] w-full mt-2">
                </div>
                <div class="glass-card p-4 border border-white/5">
                    <span class="text-[10px] font-bold text-zinc-400 uppercase">Targets: <b id="count-target" class="text-green-500">0</b></span>
                    <input type="file" id="f-target" accept=".csv" class="text-[10px] w-full mt-2">
                </div>
            </div>
            <div class="premium-border">
                <div class="glass-card p-5 space-y-4">
                    <div class="grid grid-cols-2 gap-3">
                        <input type="text" id="s-name" placeholder="Sender Name" class="input-glow">
                        <input type="text" id="s-sub" placeholder="Subject Line" class="input-glow">
                    </div>
                    <textarea id="s-body" class="input-glow font-mono text-[10px] h-[300px] custom-scroll" placeholder="HTML Code..."></textarea>
                </div>
            </div>
        </div>

        <!-- Right: Logs -->
        <div class="col-span-3 glass-card flex flex-col h-[800px]">
            <div class="p-4 border-b border-white/5 font-black text-[10px] uppercase text-zinc-500">Live Logs</div>
            <div id="log" class="p-4 space-y-2 font-mono text-[9px] overflow-y-auto custom-scroll"></div>
        </div>
    </div>

    <script>
        let smtps = [], targets = [], sent = 0, fail = 0, isRunning = false;
        let proxyList = [], activeProxy = null;

        window.onload = async () => {
            try {
                const res = await fetch('/proxies.json');
                proxyList = await res.json();
                const selector = document.getElementById('proxy-selector');
                proxyList.forEach((p, i) => {
                    const opt = document.createElement('option');
                    opt.value = i; opt.innerText = `${p.label} (${p.host})`;
                    selector.appendChild(opt);
                });
            } catch (e) { console.error("Vault failed to load"); }
        };

        function updateSelectedProxy() {
            const idx = document.getElementById('proxy-selector').value;
            activeProxy = proxyList[idx] || null;
            document.getElementById('ip-details').innerText = activeProxy ? `Selected: ${activeProxy.host}` : "Ready.";
        }

        async function connectServerProxy() {
            if(!activeProxy) return alert("Select an IP, Boss.");
            const light = document.getElementById('proxy-status-light');
            const display = document.getElementById('ip-details');
            light.className = "w-3 h-3 rounded-full bg-yellow-500 animate-pulse";
            display.innerHTML = "Handshaking...";
            
            try {
                const res = await fetch('/api/check-proxy.js', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ proxyConfig: activeProxy })
                });
                const data = await res.json();
                if (data.success) {
                    light.className = "w-3 h-3 rounded-full bg-green-500 shadow-[0_0_10px_green]";
                    display.innerHTML = `<div class="text-green-500 font-bold">TUNNEL SECURED</div><div>IP: ${data.query}</div><div>ISP: ${data.isp}</div>`;
                } else { throw new Error(data.error); }
            } catch (e) {
                light.className = "w-3 h-3 rounded-full bg-red-600";
                display.innerText = "FAILED: " + e.message;
            }
        }

        async function launch() {
            if(!smtps.length || !targets.length || !activeProxy) return alert("Setup incomplete, Boss.");
            isRunning = true;
            document.getElementById('btn-start').classList.add('hidden');
            document.getElementById('btn-stop').classList.remove('hidden');

            for(let i=0; i < targets.length; i++) {
                if(!isRunning) break;
                const smtp = smtps[i % smtps.length];
                const payload = {
                    smtpConfig: { user: smtp[0], pass: smtp[1], host: 'smtp.gmail.com', port: 465 },
                    mailData: { fromName: document.getElementById('s-name').value, to: targets[i][0], subject: document.getElementById('s-sub').value, html: document.getElementById('s-body').value },
                    proxyConfig: activeProxy
                };

                try {
                    const res = await fetch('/api/send.js', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) });
                    const r = await res.json();
                    if(r.success) { sent++; addLog(`SENT: ${targets[i][0]}`, "text-green-400"); }
                    else { fail++; addLog(`ERR: ${r.error}`, "text-red-500"); }
                } catch (e) { fail++; addLog("SERVER ERROR", "text-red-600"); }
                
                document.getElementById('v-sent').innerText = sent;
                document.getElementById('v-fail').innerText = fail;
                await new Promise(r => setTimeout(r, 2000));
            }
            isRunning = false;
            document.getElementById('btn-start').classList.remove('hidden');
            document.getElementById('btn-stop').classList.add('hidden');
        }

        function handleCSV(e, type) {
            Papa.parse(e.target.files[0], { skipEmptyLines: true, complete: r => {
                const data = r.data.filter(x => x.length > 0);
                if(type === 'smtp') { smtps = data; document.getElementById('count-smtp').innerText = data.length; }
                else { targets = data; document.getElementById('count-target').innerText = data.length; }
            }});
        }

        document.getElementById('f-smtp').onchange = e => handleCSV(e, 'smtp');
        document.getElementById('f-target').onchange = e => handleCSV(e, 'target');
        function addLog(m, c) { 
            const d = document.createElement('div'); d.className = c;
            d.innerText = `[${new Date().toLocaleTimeString()}] ${m}`;
            document.getElementById('log').prepend(d);
        }
        function forceStop() { isRunning = false; }
    </script>
</body>
</html>
